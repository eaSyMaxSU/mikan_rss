# Copy this file to config.yaml and fill in your details.

pikpak:
  username: "your_email_or_phone"   # the email/phone you log in to PikPak with
  password: "your_password"

# The PikPak folder that torrents are added into.
# Leave empty ("") to use PikPak's default download location.
# To find a folder's ID, run:  ./mikan-rss -list
folder_id: ""

# One line per mikan RSS feed. Get these from mikanani.me:
#   - a single bangumi's "RSS" button, or
#   - your aggregated feed under "我的订阅 / My Bangumi".
rss:
  - "https://mikanani.me/RSS/MyBangumi?token=YOUR_TOKEN"
  # - "https://mikanani.me/RSS/Bangumi?bangumiId=123&subgroupid=456"

# Optional (defaults shown). Both files are created in the current folder.
# state_file: "seen.json"        # remembers what was already added
# log_file: "mikan_rss.log"      # run log
